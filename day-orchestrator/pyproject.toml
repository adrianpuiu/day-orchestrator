[project]
name = "day-orchestrator"
version = "0.1.0"
description = "Single-user proactive day organizer: Gmail (IMAP/SMTP) + Telegram, Google ADK"
authors = [
    {name = "agp"},
]

dependencies = [
    "google-adk[db]>=2.12.0,<3.0.0",
    "google-adk[extensions]>=2.12.0,<3.0.0",
    "mcp>=2.2,<3",  # litellm's chat-completions handler needs the 2.x API
    "aiosqlite>=0.20,<0.22",
    "aiogram>=3.15,<4",
    "imapclient>=3.0,<4",
    "apscheduler>=3.11,<4",
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
    "keyring>=25,<27",
    "pyobjc-framework-EventKit>=10; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "import-linter>=2.0,<3",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# ScriptedLlm.responses is a pydantic model field, not a class attribute default.
"app/smoke.py" = ["RUF012"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["app"]

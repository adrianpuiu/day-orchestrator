[project]
name = "pattern-engine"
version = "0.1.0"
description = "Raschke-hinted pattern trading system on Google ADK: deterministic trading plane, LLM-component research plane"
authors = [
    {name = "agp"},
]

dependencies = [
    "google-adk[db,extensions]>=2.12.0,<3.0.0",
    "mcp>=2.2,<3",  # litellm's chat-completions handler needs the 2.x API
    "aiosqlite>=0.20,<0.22",
    "apscheduler>=3.11,<4",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.34.2",
]

requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "import-linter>=2.0,<3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Layered architecture (DESIGN.md)"
type = "layers"
layers = [
    "app.workflows",
    "app.exec",
    "app.strategies",
    "app.core",
]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run --group lint ruff check .

      - name: Import layer contracts
        run: uv run lint-imports

      - name: Offline test suite (fakes; live evals + EventKit probes are env-gated)
        run: uv run pytest -q

      - name: Offline approval-gate proof
        run: uv run python -m app.smoke
